<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ViBraille</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&family=Cairo:wght@400;600;800&display=swap">
<style>
/* Layout: navy hero with a glowing Braille cell, airy light sections, line icons, flow lanes for the two-way model, navy impact band + footer */
:root{
  --bg:#f5f8fc; --surface:#ffffff; --fg:#0e2036; --muted:#51657d; --line:#d9e4f1;
  --accent:#1c6ed5; --accent-soft:#e6f0fc; --on-accent:#ffffff; --teal:#2bb7a9;
  --deep:#0b2545; --deep2:#14406f; --on-deep:#eaf2fd; --deep-muted:#a9c2e2; --deep-line:rgba(255,255,255,.14);
  --shadow:0 18px 40px -28px rgba(11,37,69,.45);
  --f-display:"Sora","Cairo",system-ui,sans-serif; --f-body:"Source Sans 3","Cairo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1320; --surface:#101e33; --fg:#e6eefa; --muted:#9db2cc; --line:#213752;
  --accent:#5aa2ff; --accent-soft:#15304f; --on-accent:#06182e; --teal:#3ccfc0;
  --deep:#08203d; --deep2:#0f3560; --shadow:0 18px 40px -28px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1320; --surface:#101e33; --fg:#e6eefa; --muted:#9db2cc; --line:#213752;
  --accent:#5aa2ff; --accent-soft:#15304f; --on-accent:#06182e; --teal:#3ccfc0;
  --deep:#08203d; --deep2:#0f3560; --shadow:0 18px 40px -28px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.65;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5;transition:box-shadow .3s}
header.scrolled{box-shadow:0 10px 24px -18px rgba(11,37,69,.6)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.01em}
.logo span{color:var(--accent)}
.mark{width:22px;height:30px}
nav{display:flex;gap:26px;align-items:center}
nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem}
nav a:hover{color:var(--accent)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.langs button{font:600 .85rem var(--f-body);border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* hero */
.hero-band{position:relative;overflow:hidden;color:var(--on-deep);
  background:radial-gradient(circle at 12% 0%,rgba(43,183,169,.28),transparent 42%),radial-gradient(circle at 92% 100%,rgba(28,110,213,.45),transparent 50%),linear-gradient(160deg,var(--deep),var(--deep2))}
.hero-band::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.09) 1.6px,transparent 1.8px) 0 0/34px 34px;-webkit-mask-image:linear-gradient(120deg,#000,transparent 70%);mask-image:linear-gradient(120deg,#000,transparent 70%)}
.hero{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:center;padding-block:88px 96px}
.eyebrow{font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.kick{font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,4.4vw,3.05rem);line-height:1.16;margin:14px 0 20px;text-wrap:balance}
.lead{font-size:1.2rem;color:var(--deep-muted);max-width:33em;margin:0 0 32px}
.ctas{display:flex;flex-wrap:wrap;gap:14px}
.btn{display:inline-block;background:var(--on-deep);color:#0b2545;font-weight:600;padding:13px 26px;border-radius:10px;text-decoration:none;border:2px solid var(--on-deep);transition:transform .2s,box-shadow .2s}
.btn.alt{background:transparent;color:var(--on-deep);border-color:rgba(234,242,253,.5)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(0,0,0,.6)}
.demo{background:rgba(255,255,255,.07);border:1px solid var(--deep-line);border-radius:24px;padding:34px 28px;display:flex;flex-direction:column;align-items:center;gap:22px;backdrop-filter:blur(6px)}
.cell{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,1fr);gap:22px;width:min(180px,58%)}
.dot{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.14);transition:background .25s,box-shadow .25s}
.dot.on{background:var(--teal);box-shadow:0 0 0 6px rgba(43,183,169,.18),0 0 28px rgba(43,183,169,.65);animation:buzz .5s ease-in-out 2}
@keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.try{display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--deep-muted)}
.try input{width:3.2em;text-align:center;font:700 1.3rem var(--f-display);border:2px solid var(--deep-line);border-radius:10px;background:rgba(255,255,255,.08);color:var(--on-deep);padding:4px}

/* sections */
section{padding-block:84px}
.alt-bg{background:var(--surface);border-block:1px solid var(--line)}
h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.55rem,3.4vw,2.2rem);line-height:1.2;margin:0 0 14px;text-wrap:balance;max-width:22em}
.sub{color:var(--muted);max-width:40em;margin:0 0 40px;font-size:1.08rem}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:start}
.two p{margin:0 0 16px}
.two .big{font-size:1.3rem;line-height:1.55;font-family:var(--f-display);font-weight:500}
.gap{padding:28px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--line)}
.gap p{margin:0}

/* flow lanes */
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow);min-width:0}
.alt-bg .lane{background:var(--bg)}
.lane small{font-weight:600;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lane h3{font-family:var(--f-display);font-size:1.25rem;margin:6px 0 8px}
.lane p{margin:0 0 26px;color:var(--muted)}
.steps{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:22px;border-top:1px solid var(--line)}
.step{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:.88rem;font-weight:600;color:var(--fg);min-width:0;flex:1}
.step .bub{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.arr{flex:none;width:30px;height:2px;position:relative;background:linear-gradient(90deg,var(--accent) 50%,transparent 0) 0 0/8px 2px;animation:marchx 1s linear infinite;margin-bottom:26px}
.arr::after{content:"";position:absolute;right:-1px;top:-4px;width:8px;height:8px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:rotate(45deg)}
[dir="rtl"] .arr{transform:scaleX(-1)}
@keyframes marchx{to{background-position:8px 0}}

/* glove figure */
.meet{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;margin-top:72px}
.meet h3{font-family:var(--f-display);font-size:1.5rem;margin:0 0 10px}
.meet .sub{margin-bottom:24px}
.photo{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:0;box-shadow:var(--shadow)}
.photo img{width:100%;height:auto;display:block;animation:float 6s ease-in-out infinite}
.legend{list-style:none;padding:0;margin:0;display:grid;gap:16px}
.legend li{display:flex;gap:14px;align-items:flex-start}
.legend i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 .85rem var(--f-display);font-style:normal;display:grid;place-items:center;margin-top:1px}

/* features */
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.feat>div{padding:30px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0}
.feat h3{font-family:var(--f-display);font-size:1.08rem;margin:18px 0 8px}
.feat p{margin:0;color:var(--muted);font-size:1rem}
.fi{width:50px;height:50px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.85rem;padding:3px 13px;border-radius:999px}

/* impact */
.impact{background:linear-gradient(160deg,var(--deep),var(--deep2));color:var(--on-deep)}
.impact .kick{color:var(--teal)}
.impact .sub{color:var(--deep-muted)}
.imp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px}
.imp>div{padding-top:22px;border-top:1px solid var(--deep-line)}
.imp .fi{background:rgba(255,255,255,.1);color:var(--teal)}
.imp h3{font-family:var(--f-display);font-size:1.08rem;margin:18px 0 8px}
.imp p{margin:0;color:var(--deep-muted);font-size:1rem}

/* partner */
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:28px}
.who>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;min-width:0}
.who h3{font-family:var(--f-display);font-size:1.08rem;margin:16px 0 8px}
.who p{margin:0 0 14px;color:var(--muted);font-size:1rem}
.who b{color:var(--accent);font-size:.95rem}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;background:linear-gradient(160deg,var(--deep),var(--deep2));color:var(--on-deep);border-radius:18px;padding:28px 32px;margin-bottom:48px}
.mail span{font-weight:600;color:var(--deep-muted)}
.mail a{font:700 1.25rem var(--f-display);color:var(--on-deep);word-break:break-all}
.mail button{font:600 .9rem var(--f-body);border:2px solid rgba(234,242,253,.5);background:transparent;color:var(--on-deep);padding:7px 18px;border-radius:10px;cursor:pointer}
.statement{font-family:var(--f-display);font-weight:600;font-size:clamp(1.25rem,2.8vw,1.75rem);line-height:1.35;max-width:26em;margin:0;text-wrap:balance}

footer{background:var(--deep);color:var(--deep-muted);padding-block:34px;font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;justify-content:space-between}
footer .logo{color:var(--on-deep)}
footer .logo span{color:var(--teal)}
footer .txt{max-width:36em}

/* motion */
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease,box-shadow .25s;transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
.lift:hover,.js .rv.in.lift:hover{transform:translateY(-5px);box-shadow:0 22px 36px -24px var(--accent);transition-delay:0s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero>div:first-child>*{animation:up .8s ease both}
.hero>div:first-child>:nth-child(2){animation-delay:.12s}
.hero>div:first-child>:nth-child(3){animation-delay:.24s}
.hero>div:first-child>:nth-child(4){animation-delay:.36s}
.demo{animation:up .9s .2s ease both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
html[lang="ar"] body{font-family:"Cairo",var(--f-body)}
@media (max-width:820px){
  .hero,.two,.lanes,.meet{grid-template-columns:1fr}
  .hero{padding-block:52px 60px;gap:36px}
  nav a{display:none}
  section{padding-block:60px}
  .mail{padding:24px}
}
@media (max-width:460px){
  .steps{flex-direction:column;gap:10px}
  .arr{margin:0;width:2px;height:26px;background:linear-gradient(180deg,var(--accent) 50%,transparent 0) 0 0/2px 8px;animation:marchy 1s linear infinite}
  .arr::after{right:auto;left:-4px;top:auto;bottom:-1px;transform:rotate(135deg)}
  @keyframes marchy{to{background-position:0 8px}}
  [dir="rtl"] .arr{transform:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
</style>

<header><div class="wrap">
  <div class="logo"><svg class="mark" viewBox="0 0 22 30" aria-hidden="true"><g fill="var(--accent)"><circle cx="5" cy="5" r="3.6"/><circle cx="5" cy="15" r="3.6"/><circle cx="17" cy="25" r="3.6"/></g><g fill="var(--line)"><circle cx="17" cy="5" r="3.6"/><circle cx="17" cy="15" r="3.6"/><circle cx="5" cy="25" r="3.6"/></g></svg><div>Vi<span>Braille</span></div></div>
